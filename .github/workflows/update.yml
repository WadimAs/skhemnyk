name: Оновлення бази і сайту

on:
  schedule:
    - cron: "17 */3 * * *"      # кожні 3 години
  workflow_dispatch:            # кнопка «Run workflow» вручну
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Індексація Telegram-каналів
        run: |
          pip install requests beautifulsoup4
          python scripts/crawl.py
        env:
          PAGES_PER_CHANNEL: "250"
          TIME_LIMIT_MIN: "240"

      - name: Зберегти базу в репозиторій
        run: |
          git config user.name "skhemnyk-bot"
          git config user.email "skhemnyk-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Оновлення бази $(date -u '+%Y-%m-%d %H:%M')"
          git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
